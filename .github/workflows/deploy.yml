name: Deploy to GitHub Pages

# 每次 push 到 main 就自動 build 並部署到 GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch: # 也可在 Actions 頁面手動觸發

permissions:
  contents: read
  pages: write
  id-token: write

# 同時只跑一個部署，新的會取消進行中的
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 官方步驟用 2026 年的版本：v4 以前的版本以已停止支援的 Node.js 20 為目標，Actions 會一直出現警告
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24 # 和本機開發環境一致；Node 20 已於 2026-04 停止支援
          cache: npm
      - run: npm ci
      # 先檢查模擬引擎（能量平衡、SOC 上下限、排程時段…），沒過就不部署，免得把算錯的畫面推上線
      - run: npm run check
      # 後端 API 網址（repo 的 Actions 變數 HEMS_API_BASE）；沒設就只讀靜態快照
      - run: npm run build
        env:
          VITE_API_BASE: ${{ vars.HEMS_API_BASE }}
      # v4 起預設不上傳點開頭的隱藏檔；dist 裡沒有這種檔案，不受影響
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
